<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Marks Analyzer</h1>

        <p>
            Enter student details and analyze their marks.
        </p>

        <div class="form">

            <input
                type="text"
                id="studentName"
                placeholder="Student name"
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
            >

            <input
                type="number"
                id="mark1"
                placeholder="Subject 1"
            >

            <input
                type="number"
                id="mark2"
                placeholder="Subject 2"
            >

            <input
                type="number"
                id="mark3"
                placeholder="Subject 3"
            >

            <input
                type="number"
                id="mark4"
                placeholder="Subject 4"
            >

            <input
                type="number"
                id="mark5"
                placeholder="Subject 5"
            >

            <button id="analyzeButton">
                Analyze Student
            </button>

        </div>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
