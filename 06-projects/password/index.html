<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Password Generator</h1>

        <p>
            Generate a random password.
        </p>

        <div class="password-box">

            <input
                type="text"
                id="password"
                placeholder="Your password"
                readonly
            >

            <button id="copyButton">
                Copy
            </button>

        </div>


        <div class="settings">

            <label>
                Password Length:
                <span id="lengthValue">12</span>
            </label>

            <input
                type="range"
                id="length"
                min="6"
                max="30"
                value="12"
            >


            <label>
                <input
                    type="checkbox"
                    id="uppercase"
                    checked
                >

                Uppercase
            </label>


            <label>
                <input
                    type="checkbox"
                    id="numbers"
                    checked
                >

                Numbers
            </label>


            <label>
                <input
                    type="checkbox"
                    id="symbols"
                    checked
                >

                Symbols
            </label>

        </div>


        <button
            id="generateButton"
            class="generate"
        >
            Generate Password
        </button>


        <p id="message"></p>

    </main>


    <script src="script.js"></script>

</body>

</html>
